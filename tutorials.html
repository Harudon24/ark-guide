<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ARK チュートリアル</title>
<style>
:root{--bg:#071015;--panel:#0e1b22;--line:#294750;--text:#eef8fb;--muted:#9db5bc;--accent:#4fe4ea}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Segoe UI","Yu Gothic UI","Meiryo",sans-serif;color:var(--text);
background:radial-gradient(circle at 85% -5%,rgba(79,228,234,.11),transparent 28%),linear-gradient(180deg,#071015,#09151b 60%,#071015)}
nav{position:sticky;top:0;padding:10px 16px;background:rgba(7,16,21,.94);border-bottom:1px solid rgba(79,228,234,.15)}
nav a{color:#edfeff;text-decoration:none;font-weight:700}
main{width:min(960px,calc(100% - 28px));margin:auto;padding:40px 0 60px}
.kicker{color:#a4f9fc;font-size:11px;font-weight:800;letter-spacing:.18em}
h1{font-size:clamp(34px,6vw,56px);margin:8px 0 8px}.lead{color:#b7cbd0;margin:0 0 24px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.card{display:block;text-decoration:none;color:inherit;padding:22px;border:1px solid var(--line);border-radius:20px;background:var(--panel)}
.card:hover{border-color:rgba(79,228,234,.55)}.num{color:#6b8c94;font-size:12px;font-weight:800;letter-spacing:.12em}
.card h2{margin:9px 0 8px;font-size:24px}.card p{margin:0;color:#a9bec4;line-height:1.8;font-size:14px}
.arrow{margin-top:18px;color:var(--accent);font-weight:800}
@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<nav><a href="index.html">← ARK Guide</a></nav>
<main>
  <div class="kicker">ARK: SURVIVAL EVOLVED / BEGINNER</div>
  <h1>チュートリアル</h1>
  <p class="lead">最初に知っておくと遊びやすいことを、順番にまとめています。</p>
  <section class="grid">
    <a class="card" href="beginner_base_2x2.html">
      <div class="num">TUTORIAL 01</div>
      <h2>拠点づくり</h2>
      <p>素材集め、エングラム、能力値、2×2の最初の拠点を作るところまで。</p>
      <div class="arrow">開く →</div>
    </a>
    <a class="card" href="tutorial_taming.html">
      <div class="num">TUTORIAL 02</div>
      <h2>テイム方法</h2>
      <p>ボーラ、気絶、餌、気絶値の維持、サドルまで。最初のテイムの基本。</p>
      <div class="arrow">開く →</div>
    </a>
  </section>
</main>
</body>
</html>
