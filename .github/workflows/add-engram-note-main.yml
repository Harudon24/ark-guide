name: Add engram guidance note to main

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/add-engram-note-main.yml'
      - '.github/scripts/add_engram_note_main.py'

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Update HTML
        run: python3 .github/scripts/add_engram_note_main.py
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add beginner_base_2x2_stats.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Add engram point guidance"
            git push origin HEAD:main
          fi
